<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shooting-star</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>">
<script>try{var t=JSON.parse(localStorage.getItem("ss.theme")||'"dark"');if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="activity">
  <button class="act on" data-view="files" title="파일"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  <button class="act" data-view="memo" title="메모 (⌘/Ctrl+Alt+N: 새 메모)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 10h7M8.5 14h7M8.5 17.5h4"/></svg></button>
  <button class="act" data-view="git" title="Git — 변경된 파일 커밋/푸시"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M6 8.2v7.6M18 11.2c0 4-6 3-11 5.6"/></svg></button>
  <button class="act" data-view="run" title="Run — 등록된 스크립트 실행 (Claude 와 공유)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg></button>
  <button class="act" data-view="db" title="DB — 연결 / 스키마 / SQL"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg></button>
</nav>
<aside id="sidebar">
  <header>
    <span id="root-name" title=""></span>
    <button id="btn-fav" title="즐겨찾기 폴더 토글">☆</button>
    <button id="btn-new-file" title="새 파일">＋</button>
    <button id="btn-new-dir" title="새 폴더">▢</button>
    <button id="btn-collapse" title="모두 접기">⊟</button>
    <button id="btn-settings" title="설정 (⌘,)">⚙</button>
  </header>
  <div id="favs"></div>
  <div id="tree-bar">
    <button id="btn-filter" title="설정된 파일 형식이 있는 폴더만 보기"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M1.5 2h13a.5.5 0 0 1 .38.82L10 8.6V14a.5.5 0 0 1-.74.44l-3-1.7A.5.5 0 0 1 6 12.3V8.6L1.12 2.82A.5.5 0 0 1 1.5 2z"/></svg></button>
    <span id="filter-info"></span>
  </div>
  <div id="tsearch" hidden><span class="ts-scope"></span><input id="ts-input" placeholder="이름 검색…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><span class="ts-count"></span></div>
  <nav id="tree" tabindex="0"></nav>
  <div id="memo-view" hidden>
    <div class="mv-head"><span>메모</span><button id="btn-memo-new" title="새 메모 (⌘/Ctrl+Alt+N)">＋</button></div>
    <input id="memo-q" placeholder="메모 검색…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="memo-list"></div>
    <div class="mv-foot" id="memo-path"></div>
  </div>
  <div id="db-view" hidden>
    <div class="mv-head"><span>DB</span><button id="btn-db-new" title="새 연결">＋</button><button id="btn-db-refresh" title="목록 새로고침 (캐시를 버리고 DB 에서 다시 가져옴)">⟳</button></div>
    <input id="db-q" placeholder="스키마·테이블 검색…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="db-list"></div>
  </div>
  <div id="run-view" hidden>
    <div class="mv-head"><span>Run</span><button id="btn-run-new" title="새 스크립트">＋</button><button id="btn-run-refresh" title="새로고침">⟳</button></div>
    <div id="run-list"></div>
    <div class="mv-foot" id="run-foot"></div>
  </div>
  <div id="git-view" hidden>
    <div class="mv-head"><span>Git</span><button id="btn-git-refresh" title="새로고침">⟳</button></div>
    <div id="git-list"></div>
  </div>
</aside>
<div id="resizer"></div>
<main>
  <div id="tabs"></div>
  <div id="toolbar"></div>
  <div id="content">
    <div id="empty">
      <p>★ shooting-star</p>
      <p><kbd>Shift</kbd>×2 / <kbd>⌘/Ctrl</kbd>+<kbd>P</kbd> 파일 검색 · <kbd>⌘/Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> 내용 검색 · <kbd>⌘/Ctrl</kbd>+<kbd>S</kbd> 저장 · <kbd>⌘/Ctrl</kbd>+<kbd>O</kbd> 폴더 열기 · <kbd>⌘/Ctrl</kbd>+<kbd>B</kbd> 사이드바 · <kbd>⌘/Ctrl</kbd>+<kbd>E</kbd> 보기/편집 전환</p>
    </div>
  </div>
  <div id="fbar" hidden></div>
  <footer id="status"><span id="st-path"></span><span id="st-msg"></span><span id="st-idx"></span><span id="st-save" hidden></span><span id="st-update" hidden></span><span id="st-zoom" title="본문 글자 크기 (클릭: 100%로 초기화)" hidden></span><span id="st-pos"></span></footer>
</main>
<div id="menu" hidden></div>
<div id="palette" hidden><input id="pal-input" placeholder="파일 이름 검색…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><ul id="pal-list"></ul></div>
<div id="picker" hidden><input id="pk-input" placeholder="/path/to/folder" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><ul id="pk-list"></ul></div>
<div id="toast" hidden></div>
<script src="vendor/marked.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/js-yaml.umd.min.js"></script>
<script src="highlight.js"></script>
<script src="app.js"></script>
</body>
</html>
