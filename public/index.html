<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shooting-star</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="activity">
  <button class="act on" data-view="files" title="파일"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  <button class="act" data-view="memo" title="메모 (⌘/Ctrl+Alt+N: 새 메모)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 10h7M8.5 14h7M8.5 17.5h4"/></svg></button>
</nav>
<aside id="sidebar">
  <header>
    <span id="root-name" title=""></span>
    <button id="btn-fav" title="즐겨찾기 폴더 토글">☆</button>
    <button id="btn-new-file" title="새 파일">＋</button>
    <button id="btn-new-dir" title="새 폴더">▢</button>
    <button id="btn-collapse" title="모두 접기">⊟</button>
    <button id="btn-settings" title="설정 (⌘,)">⚙</button>
  </header>
  <div id="favs"></div>
  <div id="tree-bar">
    <button id="btn-filter" title="설정된 파일 형식이 있는 폴더만 보기"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M1.5 2h13a.5.5 0 0 1 .38.82L10 8.6V14a.5.5 0 0 1-.74.44l-3-1.7A.5.5 0 0 1 6 12.3V8.6L1.12 2.82A.5.5 0 0 1 1.5 2z"/></svg></button>
    <span id="filter-info"></span>
  </div>
  <nav id="tree" tabindex="0"></nav>
  <div id="memo-view" hidden>
    <div class="mv-head"><span>메모</span><button id="btn-memo-new" title="새 메모 (⌘/Ctrl+Alt+N)">＋</button></div>
    <input id="memo-q" placeholder="메모 검색…" autocomplete="off" spellcheck="false">
    <div id="memo-list"></div>
    <div class="mv-foot" id="memo-path"></div>
  </div>
</aside>
<div id="resizer"></div>
<main>
  <div id="tabs"></div>
  <div id="toolbar"></div>
  <div id="content">
    <div id="empty">
      <p>★ shooting-star</p>
      <p><kbd>Shift</kbd>×2 / <kbd>⌘/Ctrl</kbd>+<kbd>P</kbd> 파일 검색 · <kbd>⌘/Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> 내용 검색 · <kbd>⌘/Ctrl</kbd>+<kbd>S</kbd> 저장 · <kbd>⌘/Ctrl</kbd>+<kbd>O</kbd> 폴더 열기 · <kbd>⌘/Ctrl</kbd>+<kbd>B</kbd> 사이드바 · <kbd>⌘/Ctrl</kbd>+<kbd>E</kbd> 보기/편집 전환</p>
    </div>
  </div>
  <footer id="status"><span id="st-msg"></span><span id="st-idx"></span><span id="st-pos"></span></footer>
</main>
<div id="menu" hidden></div>
<div id="palette" hidden><input id="pal-input" placeholder="파일 이름 검색…" autocomplete="off"><ul id="pal-list"></ul></div>
<div id="picker" hidden><input id="pk-input" placeholder="/path/to/folder" autocomplete="off" spellcheck="false"><ul id="pk-list"></ul></div>
<div id="toast" hidden></div>
<script src="vendor/marked.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/js-yaml.umd.min.js"></script>
<script src="highlight.js"></script>
<script src="app.js"></script>
</body>
</html>
